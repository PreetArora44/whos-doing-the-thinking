<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's Doing the Thinking?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1a0f1f;--bg2:#241629;--ink:#fbf6fa;--soft:#cdbfd3;--rose:#ff8fa3;--dusk:#8f7aa8;--rule:#3d2c44}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:var(--rose);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:4px}
.band{padding-block:clamp(28px,4vw,64px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.alt{background:var(--bg2)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:12px max(5vw,16px)}
nav strong{font-family:"Inter Tight",sans-serif;font-weight:600;margin-right:auto}
nav a{color:var(--soft);text-decoration:none;font-size:15px;padding:6px 0}
nav a:hover{color:var(--ink)}
h1,h2,h3{font-family:"Inter Tight",sans-serif;text-wrap:balance;letter-spacing:-.02em;margin:0}
h1{font-weight:300;font-size:clamp(44px,7vw,80px);line-height:1.02}
h2{font-weight:600;font-size:clamp(30px,3.6vw,44px);line-height:1.08;margin-bottom:18px}
h3{font-weight:600;font-size:22px;line-height:1.2;margin-bottom:8px}
.sub{font-size:clamp(18px,2vw,22px);color:var(--soft);max-width:60ch;margin:16px 0 6px}
.by{font-size:15px;color:var(--soft);margin:0}
.fig{position:relative;min-height:380px;margin-top:28px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:16px 32px;border-top:1px solid var(--rule);padding-top:18px;margin-top:8px}
.figs b{display:block;font:300 clamp(34px,4vw,48px)/1.05 "Inter Tight",sans-serif}
.figs span{color:var(--soft);font-size:15px}
.cap{font-size:14px;color:var(--soft);margin:12px 0 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.q{border-left:3px solid var(--rose);padding:4px 0 4px 20px;margin:0}
.q p{margin:0 0 10px}
.label{font-size:15px;color:var(--rose);font-weight:600;margin:0 0 6px}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:20px}
.term{border-top:1px solid var(--rule);padding-top:14px}
.term p{margin:0;color:var(--soft);font-size:16px}
.persp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.persp p{margin:0 0 14px}
.stance{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;font-size:16px}
.alt .stance{background:var(--bg2)}
.band:not(.alt) .stance{background:var(--bg2)}
.flow{display:grid;gap:10px}
.step{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--bg)}
.step.key{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--bg))}
.step b{display:block;font-family:"Inter Tight",sans-serif;font-size:19px}
.step span{color:var(--soft);font-size:15px}
.arrow{color:var(--dusk);text-align:center;font-size:22px;line-height:1}
.mod{border:1px dashed var(--dusk);border-radius:10px;padding:12px 16px;font-size:15px;color:var(--soft)}
.mod b{color:var(--ink)}
.video{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:16px;background:var(--bg);text-decoration:none;color:var(--ink);margin-top:8px}
.video:hover{border-color:var(--rose)}
.video svg{width:64px;height:64px}
.video small{display:block;color:var(--soft);font-size:14px}
.video em{font-style:normal;color:var(--rose);font-size:15px;font-weight:600}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19em),1fr));gap:18px}
.card{border:1px solid var(--rule);border-radius:12px;padding:18px;background:var(--bg)}
.card p{margin:0 0 10px;font-size:16px}
.card .meta{color:var(--soft);font-size:14px}
.card a{overflow-wrap:anywhere;font-size:15px}
.kind{font-size:14px;color:var(--dusk);font-weight:600;margin:0 0 6px}
.cited p{padding-left:2em;text-indent:-2em;margin:0 0 14px;font-size:16px}
.cited a{overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:999px;background:var(--rose);color:#1a0f1f;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.cta{margin:18px 0 0}
nav a.navbtn{color:var(--rose);font-weight:600}
footer{border-top:1px solid var(--rule);color:var(--soft);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media(max-width:820px){.two,.persp{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){body{font-size:16px}.fig{min-height:320px}nav strong{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.draw{animation:none!important}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 1.4s ease-out .2s forwards}
@keyframes d{to{stroke-dashoffset:0}}
</style>
</head>
